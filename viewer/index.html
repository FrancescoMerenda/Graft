<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graft viz</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="appbar">
  <div class="brand"><b>graft</b><span id="repoName"></span></div>
  <div class="counts" id="counts"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" aria-selected="true" data-tab="context">Context</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="code">Code</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="outline">Outline</button>
  </nav>
  <div class="searchbox">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Search nodes…" aria-label="Search nodes">
  </div>
  <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<main class="stage" id="stage">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas class="graph" id="graphCanvas" role="img" aria-label="Force-directed graph"
      title="Click a node to see what it touches · double-click a group to open it · drag to place, double-click to release"></canvas>
    <div class="edgestyle" id="edgeChips"><span class="cap">Edges</span></div>
    <div class="tools" id="tools">
      <div class="toolrow">
        <label class="cap" for="groupSel">Group</label>
        <select id="groupSel" class="sel" title="Roll symbols up by directory"></select>
        <label class="cap" for="layoutSel">Layout</label>
        <select id="layoutSel" class="sel" title="How positions are chosen">
          <option value="tree">tree</option>
          <option value="orbit">orbit</option>
          <option value="force">force</option>
          <option value="radial">radial</option>
          <option value="layered">layered</option>
        </select>
        <button type="button" class="echip on" id="orphanChip" title="Symbols nothing links to">orphans</button>
      </div>
      <div class="toolrow">
        <span class="cap">Edges</span>
        <button type="button" class="echip on" data-layer="code" title="What the program does: calls, references, inheritance">code</button>
        <button type="button" class="echip" data-layer="file" title="How the tree is assembled: imports, includes, containment">files</button>
        <button type="button" class="echip" data-layer="all" title="Both at once">all</button>
      </div>
      <div class="toolrow" id="analysisRow">
        <span class="cap">Find</span>
        <button type="button" class="echip" id="cyclesBtn" title="Strongly connected components — dependency cycles">cycles</button>
        <button type="button" class="echip" id="hubsBtn" title="The most connected symbols">hubs</button>
        <button type="button" class="echip" id="lensBtn" title="Isolate the selection and what it touches, 2 hops">lens</button>
        <button type="button" class="echip" id="pathBtn" title="Shortest dependency path between two selections">path</button>
        <button type="button" class="echip" id="clearBtn" title="Clear the finding" hidden>clear</button>
      </div>
      <div class="crumbs" id="crumbs" hidden></div>
      <div class="finding" id="finding" hidden></div>
    </div>
    <div class="lcount" id="lcount"></div>
    <div class="legend" id="legend"></div>
    <div class="zoomctl">
      <button class="iconbtn" id="zin" aria-label="Zoom in">+</button>
      <button class="iconbtn" id="zout" aria-label="Zoom out">−</button>
      <button class="iconbtn" id="zreset" aria-label="Reset view">⟲</button>
    </div>
    <div class="emptytab" id="graphEmpty" hidden></div>
  </div>
  <div class="outline" id="outlineView" hidden>
    <div class="tree" id="tree"></div>
  </div>
  <div class="resizer" id="detailResizer" role="separator" aria-orientation="vertical" aria-label="Resize details panel" tabindex="0" title="Drag to resize"></div>
  <aside class="detail" id="detail"><div class="empty">Select a node to view details</div></aside>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
